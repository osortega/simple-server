<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blue HTML Sample</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #eaf2ff;
        color: #0b3d91;
        font-family: Arial, sans-serif;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        border: 2px solid #2563eb;
        border-radius: 0.75rem;
        background: white;
        text-align: center;
      }

      button {
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blue HTML Sample</h1>
      <p>A simple page styled with a clean blue color palette.</p>
      <button type="button">Blue Button</button>
    </main>
  </body>
</html>
